<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
    <div>
<!--        # при нажатии на кнопку направить данные из текстового поля методом GET по адресу /weather-->
        <form action="/weather" method="get">
            <input type="text" name="city" placeholder="Например, Томск">
<!--            # текстовый тип, city - имя параметра-->
            <button type="submit">Узнать</button>
        </form>

        {% if city and result %}
            <p>Вы запросили: {{ city }}</p>
            <p>{{ result }}</p>

        {% endif %}

        {% for c in citys %}
            <a class="link" href="/weather?city={{ c }}">{{ c }}</a>
        {% endfor %}
    </div>
</body>
</html>
